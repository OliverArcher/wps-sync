<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>wps-sync</title>
    <style>
      html, body, #root { height: 100%; margin: 0; }
      body { overflow: hidden; }

      /* Win11 细滚动条：默认细条，悬停变粗变深 */
      ::-webkit-scrollbar { width: 11px; height: 11px; }
      ::-webkit-scrollbar-track { background: transparent; }
      ::-webkit-scrollbar-thumb {
        background: rgba(0, 0, 0, 0.3); border: 3px solid transparent;
        background-clip: padding-box; border-radius: 8px;
      }
      ::-webkit-scrollbar-thumb:hover { background: rgba(0, 0, 0, 0.55); border-width: 2px; }
      ::-webkit-scrollbar-corner { background: transparent; }

      /* 命令栏：圆角方形纯图标按钮（Win11 工具栏风格） */
      .cmdbar { display: flex; align-items: center; gap: 3px; }
      .cmdbtn {
        display: inline-flex; align-items: center; justify-content: center;
        width: 36px; height: 36px; padding: 0; border: none; border-radius: 6px;
        background: transparent; cursor: pointer; transition: background 0.12s ease;
      }
      .cmdbtn:hover:not(:disabled) { background: rgba(0, 0, 0, 0.055); }
      .cmdbtn:active:not(:disabled) { background: rgba(0, 0, 0, 0.09); }
      .cmdbtn:disabled { opacity: 0.38; cursor: default; }
      .cmdbtn img { display: block; width: 18px; height: 18px; }
      .cmdiv { width: 1px; height: 20px; background: #d9d9d9; margin: 0 7px; flex-shrink: 0; }

      /* BreadcrumbBar（Win 设计规范）：根目录 › 一级 › 二级 */
      .breadcrumb { display: flex; align-items: center; gap: 2px; font-size: 13px; min-height: 32px; }
      .breadcrumb button {
        border: none; background: transparent; border-radius: 4px;
        padding: 3px 7px; cursor: pointer; font-size: 13px; color: #242424;
        max-width: 220px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
        transition: background 0.12s ease;
      }
      .breadcrumb button:hover { background: rgba(0, 0, 0, 0.055); }
      .breadcrumb .bcur { color: #0c2e52; font-weight: 500; }
      .bsep { color: #9e9e9e; margin: 0 1px; user-select: none; }

      .navbtn {
        display: flex; align-items: center; justify-content: center;
        width: 38px; height: 38px; margin: 0 auto 4px; border: none; border-radius: 5px;
        background: transparent; cursor: pointer; transition: background 0.12s ease;
      }
      .navbtn:hover { background: rgba(0, 0, 0, 0.06); }
      .navbtn.active { background: rgba(0, 0, 0, 0.085); }
      .navbtn img { display: block; width: 20px; height: 20px; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/renderer/main.jsx"></script>
  </body>
</html>
